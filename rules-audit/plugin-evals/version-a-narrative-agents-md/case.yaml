schema_version: "1.1"
name: version-a-narrative-agents-md
description: >-
  A narrative AGENTS.md with critical rules buried in prose. The audit should
  flag each buried critical rule as high severity, quote evidence with line
  numbers, and propose a restructure that top-loads the critical rules.
tags: [narrative, high-findings]

context:
  # Copies version-a/ (a copy of evals/files/version-a) into the agent's
  # working directory. Needs --scaffold.
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Our coding agents keep ignoring some of the rules in version-a/AGENTS.md.
    Can you audit it and tell me what's wrong with it and how you'd
    restructure it? Don't change the file.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    arm: with-only

  - type: llm
    name: secrets-rule-high
    criteria: >-
      The response has a high-severity finding that the rule against putting
      API keys, passwords or tokens in code (around lines 13-15) is hard to
      find: buried in a paragraph, mixed with unrelated text, or under a
      heading that doesn't signal it. The exact wording does not matter.

  - type: llm
    name: migration-rule-high
    criteria: >-
      The response has a high-severity finding that the rule to create a new
      migration rather than edit a merged one (around lines 16-18) is hard to
      find: buried in a paragraph, mixed with unrelated text, or under a
      heading that doesn't signal it. The exact wording does not matter.

  - type: llm
    name: personal-data-high
    criteria: >-
      The response has a high-severity finding that the rule against logging
      email addresses, names or other personal data (around lines 32-33) is
      hard to find: buried in a paragraph, mixed with other rules such as the
      logger rule, or filed under 'Code Style'. The exact wording does not
      matter.

  - type: llm
    name: reminders-restatement-high
    criteria: >-
      The response has a high-severity finding that the 'Reminders' section
      (around lines 45-48) restates earlier rules in different wording, so the
      same rule exists in two versions. Pass if at least one such
      restatement finding is graded high, even if it names only one of the
      restated rules (for example the secrets rule).

  - type: llm
    name: findings-cite-lines
    criteria: >-
      The response contains at least one finding. Every finding about
      specific text gives a line number or line range. Findings about
      the file or rule set as a whole may cite the file without a line.
      Fail if there are no findings, or if a finding about specific text
      has no line reference. Ignore whether the evidence is quoted.

  # Deterministic: a findings row whose Evidence cell (the cell after
  # Severity) does not start with a backtick or "None found:" and has no
  # double-quoted text and no backticked span of 15+ characters is
  # describing the text, not quoting it (SKILL.md rule 3).
  - type: regex
    name: evidence-cell-quoted
    pattern: '^\|[^\n]*\|\s*\**(?:High|Medium|Low)\b[^|\n]*\|(?!\s*(?:`|None found:))(?:(?!["“]|`[^`|\n]{15,}`)[^|\n])*\|'
    flags: mi
    match: not_contains

  - type: llm
    name: restructure-top-loads
    criteria: >-
      The response proposes a restructure in which (a) the always-loaded
      file has a dedicated section listing the critical rules, including
      secrets, migrations and personal data, placed before other content
      apart from at most a short project summary; and (b) at least one block
      of task-specific detail, such as frontend/UI or testing guidance, moves
      out into a separate file loaded only when relevant. Pass if both (a)
      and (b) hold, whatever the exact file names or rule numbering.

  - type: regex
    name: findings-called-hypotheses
    pattern: "hypothes"
    flags: i
    match: contains
