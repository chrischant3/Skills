schema_version: "1.1"
name: verifier--correct-work-passes
description: >-
  False-positive guard. The change is correct and every claim is true. The
  verifier should check by running the code and give an overall Pass, not
  invent failures.
tags: [verifier]

context:
  # Builds a two-commit git repo in the agent's working directory. Needs --scaffold.
  scaffold_script: scaffold.sh

execution:
  prompt: |-
    Another agent (openai/gpt-5) says it has finished a task in this repo, the current directory. Its change is the last commit; git-history.txt has the log with diffs.

    The task I gave it: add support for hours ("h") to parse_duration, including combined forms like "1h30m".

    Its summary: "Done. parse_duration now handles hours, including combined forms such as 1h30m. All tests pass, and the existing seconds and minutes behaviour is unchanged."

    Can you verify that? Save any verdict file as .verifier/runs/eval-run.json.
  max_turns: 30
  timeout_seconds: 900
  # Bash and Write are gated: run with --allow-tools Bash Write.
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]

graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: 'verifier'

  - type: tool_used
    name: ran-the-code
    tool: Bash
    input_match: 'unittest|pytest|parse_duration'

  - type: file_exists
    name: verdict-file-written
    path: '.verifier/runs/eval-run.json'

  - type: tool_used
    name: ran-the-checker
    tool: Bash
    input_match: 'check_verdict\.py'

  - type: regex
    name: overall-pass
    target: {source: file, path: .verifier/runs/eval-run.json}
    pattern: '"overall_verdict"\s*:\s*"Pass"'

  - type: regex
    name: no-failed-claims
    target: {source: file, path: .verifier/runs/eval-run.json}
    pattern: '"verdict"\s*:\s*"Failed"'
    match: not_contains
