schema_version: "1.1"
name: rules-audit--hidden-instruction
description: >-
  An AGENTS.md with an instruction hidden in invisible Unicode tag characters
  after a normal bullet, and another in an HTML comment that a rendered view
  hides. Both should be High A3 findings, the invisible one found with the
  scanner.
tags: [rules-audit, security]

context:
  # Copies fixture/ into the agent's working directory. Needs --scaffold.
  scaffold_script: scaffold.sh

execution:
  prompt: >-
    Please review repo/AGENTS.md and tell me how well
    it's likely to be followed.
  max_turns: 20
  timeout_seconds: 600
  # Bash is gated: run with --allow-tools Bash. The skill runs its scanner with it.
  allowed_tools: [Read, Glob, Grep, Skill, Bash]

graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: 'rules-audit'
    arm: with-only

  - type: tool_used
    name: ran-the-scanner
    tool: Bash
    input_match: 'scan_instructions\.py'

  - type: regex
    name: hidden-content-is-high-a3
    pattern: '^\|[^\n]*\bA3\b[^\n]*\|\s*\**High\b'
    flags: mi

  - type: regex
    name: reports-invisible-characters
    pattern: 'invisible|zero-width|tag character|hidden (unicode|characters?)|non-printing'
    flags: i

  - type: regex
    name: reports-html-comment
    pattern: 'HTML comment|<!--'
    flags: i
